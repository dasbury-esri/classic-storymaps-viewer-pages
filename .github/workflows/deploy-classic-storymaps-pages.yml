name: Deploy Classic Storymaps Pages

on:
  workflow_dispatch:
  push:
    branches:
      - '**'

permissions: {}

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SITE_BASE_PATH: ${{ vars.SITE_BASE_PATH }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Run tests
        run: node --test scripts/tests/*.test.mjs

      - name: Build runtimes, landing, and publish output
        run: |
          set -euo pipefail
          bash scripts/build-maptour-runtime.sh
          bash scripts/build-swipe-runtime.sh
          bash scripts/build-mapjournal-runtime.sh
          bash scripts/build-mapseries-runtime.sh
          bash scripts/build-cascade-runtime.sh
          bash scripts/build-shortlist-runtime.sh
          bash scripts/build-crowdsource-runtime.sh
          bash scripts/build-basic-runtime.sh
          bash scripts/build-classic-storymaps-landing.sh
          bash scripts/build-classic-storymaps-runtime-publish.sh

      - name: Add Pages deploy metadata
        run: |
          set -euo pipefail
          touch publish/.nojekyll
          printf '%s\n' 'classicstorymaps.com' > publish/CNAME

      - name: Validate publish artifact structure
        run: |
          set -euo pipefail
          test -f publish/index.html
          test -f publish/viewers/index.html
          for runtime in maptour swipe mapjournal mapseries cascade shortlist crowdsource basic; do
            test -f "publish/viewers/$runtime/index.html"
          done
          test -f publish/viewers/cascade/app/viewer-min.js
          test -f publish/viewers/cascade/resources/styles/calcite/colors-default.less
          test -f publish/viewers/cascade/resources/styles/calcite/variables.less

      - name: Validate published links
        env:
          PUBLISH_CHECK_ROOT: publish
        run: node --test scripts/tests/check-links.test.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: publish

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
